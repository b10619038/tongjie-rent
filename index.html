<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="theme-color" content="#62765b" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="統潔＆信潔開發" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>統潔＆信潔開發有限公司 — 租房管理</title>
  <link rel="stylesheet" href="app.css?v=0285" />
  <link rel="stylesheet" href="work-scroll.css?v=0285" />
  <style>
    html, body { margin: 0; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 9999;
      display: grid; place-items: center;
    }
    #splash svg {
      width: 72px; height: 72px; opacity: 0;
      animation: splashHouse 1.8s ease forwards;
    }
    #splash.out { animation: splashFade .45s ease forwards; pointer-events: none; display: none; }
    #splash.out svg { animation: none; opacity: 0; }
    @keyframes splashHouse {
      0% { opacity: 0; transform: translateY(18px) scale(.86); }
      28% { opacity: 1; transform: translateY(0) scale(1); }
      62% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.05); }
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#62765b" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
    </svg>
  </div>
  <div id="app"></div>
  <script>
    function isDevPreview() {
      try { return !!(window.ui && ui.devPreview && ui.role === "tenant"); }
      catch (e) { return false; }
    }
  </script>
  <script src="app.js?v=0285"></script>
  <script src="work-enhance.js?v=0285"></script>
  <script>setTimeout(function(){ var s=document.getElementById("splash"); if(s) s.classList.add("out"); }, 3500);</script>
</body>
</html>
