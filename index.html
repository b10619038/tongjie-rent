<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#62765b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="統潔＆信潔開發" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>統潔＆信潔開發有限公司 — 租房管理</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body { margin: 0; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 9999;
      display: grid; place-items: center;
    }
    #splash svg {
      width: 72px; height: 72px; opacity: 0;
      animation: splashHouse 1.8s ease forwards;
    }
    #splash.out { animation: splashFade .45s ease forwards; pointer-events: none; }
    @keyframes splashHouse {
      0% { opacity: 0; transform: translateY(18px) scale(.86); }
      28% { opacity: 1; transform: translateY(0) scale(1); }
      62% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.05); }
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#62765b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.2 11.4C4.2 11.4 8.2 7.2 12 4.4c3.8 2.8 7.8 7 7.8 7"/>
      <path d="M6.2 10.8h11.6c.9 0 1.6.7 1.6 1.6v6.6c0 1.1-.9 2-2 2H6.6c-1.1 0-2-.9-2-2v-6.6c0-.9.7-1.6 1.6-1.6z"/>
      <path d="M10 20.8v-5.2c0-.6.5-1.1 1.1-1.1h1.8c.6 0 1.1.5 1.1 1.1v5.2"/>
    </svg>
  </div>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
