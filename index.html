  <title>統潔＆信潔開發有限公司 — 租房管理</title>

  <style>
    .ann-ig-comment { width: 40px; height: 40px; margin-left: 0; }
    .ann-ig-comment svg { width: 22px; height: 22px; stroke-width: 2.16 !important; }
  </style>

  <style>
    html, body { margin: 0; background: #ffffff; }
    html.tj-updating #app { visibility: hidden; }
    #splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 9999;
      display: grid; place-items: center;
    }
    html.tj-updating #splash { display: grid !important; opacity: 1 !important; }
    #splash svg {
      width: 72px; height: 72px; opacity: 0;
      animation: splashHouse 1.8s ease forwards;
    }
    html.tj-updating #splash .splash-house { display: none !important; }
    #splash.out { animation: splashFade .45s ease forwards; pointer-events: none; display: none; }
    #splash.out svg { animation: none; opacity: 0; }
    .upd-panel { display: none; flex-direction: column; align-items: center; width: min(320px, 84vw); }
    html.tj-updating #splash .upd-panel { display: flex; }
    .upd-kicker { font-size: 12px; letter-spacing: .14em; color: #8a9186; margin-bottom: 10px; }
    .upd-title { font-size: 22px; font-weight: 700; color: #243028; letter-spacing: .04em; }
    .g-track {
      position: relative;
      width: 100%;
      height: 4px;
      margin-top: 22px;
      border-radius: 99px;
      background: #e8eaed;
      overflow: hidden;
    }
    .g-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #4285F4 0%, #EA4335 34%, #FBBC05 67%, #34A853 100%);
      transition: width .28s cubic-bezier(.4,0,.2,1);
    }
    .g-track::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 38%;
      left: -40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
      animation: gSheen 1.15s ease-in-out infinite;
    }
    @keyframes gSheen { to { left: 120%; } }
    @keyframes splashHouse {
      0% { opacity: 0; transform: translateY(18px) scale(.86); }
      28% { opacity: 1; transform: translateY(0) scale(1); }
      62% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.05); }
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
  <script>
    (function () {
      try {
        if (sessionStorage.getItem("tj-updating")) document.documentElement.classList.add("tj-updating");
      } catch (e) {}
      function tick() {
        if (!document.documentElement.classList.contains("tj-updating")) return;
        var bar = document.getElementById("g-bar");
        if (bar && !window.__updDone) {
          var t0 = Date.now();
          try { t0 = Number(sessionStorage.getItem("tj-updating")) || Date.now(); } catch (e) {}
          var elapsed = Date.now() - t0;
          var pct = Math.min(90, 14 + 76 * (1 - Math.exp(-(elapsed / 1000) / 0.8)));
          bar.style.width = pct.toFixed(1) + "%";
        }
        requestAnimationFrame(tick);
      }
      window.__tickUpdateBar = tick;
      if (document.documentElement.classList.contains("tj-updating")) requestAnimationFrame(tick);
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg class="splash-house" viewBox="0 0 24 24" fill="none" stroke="#62765b" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
    </svg>
    <div class="upd-panel">
      <div class="upd-kicker">統潔＆信潔開發</div>
      <div class="upd-title">正在更新</div>
      <div class="g-track"><div class="g-bar" id="g-bar"></div></div>
    </div>
  </div>
  <div id="app"></div>
  <script>
    function isDevPreview() {
      try { return !!(window.ui && ui.devPreview && ui.role === "tenant"); }
      catch (e) { return false; }
    }
  </script>

</body>
