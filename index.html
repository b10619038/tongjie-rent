  <style>
    html, body { margin: 0; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 9999;
      display: grid; place-items: center;
    }
    #splash svg {
      width: 72px; height: 72px; opacity: 0;
      animation: splashHouse 1.8s ease forwards;
    }
    #splash.out { animation: splashFade .45s ease forwards; pointer-events: none; display: none; }
    #splash.out svg { animation: none; opacity: 0; }
    @keyframes splashHouse {
      0% { opacity: 0; transform: translateY(18px) scale(.86); }
      28% { opacity: 1; transform: translateY(0) scale(1); }
      62% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.05); }
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
  <script>
    (function () {
      var raw = "";
      try { raw = sessionStorage.getItem("tj-updating") || ""; } catch (e) {}
      var t0 = Number(raw) || 0;
      if (!t0) return;
      if (Date.now() - t0 > 20000) {
        try { sessionStorage.removeItem("tj-updating"); } catch (e) {}
        return;
      }
      document.documentElement.classList.add("tj-updating");
      var teal = "#62765b", paper = "#ffffff";
      try {
        teal = sessionStorage.getItem("tj-upd-teal") || teal;
        paper = sessionStorage.getItem("tj-upd-paper") || paper;
      } catch (e) {}
      function waveD(w, h, phase, pct) {
        var amp = 10, mid = h / 2, len = Math.max(1, w * pct), d = "", x;
        for (x = 0; x <= len; x += 1.4) {
          var y = mid + Math.sin(x * 0.05 + phase) * amp;
          d += (x ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
        }
        return d;
      }
      function paint() {
        if (document.getElementById("upd-cover")) return;
        var el = document.createElement("div");
        el.id = "upd-cover";
        el.setAttribute("style", "position:fixed;inset:0;z-index:2147483646;background:" + paper + ";display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;");
        el.innerHTML = '<svg id="upd-house" viewBox="0 0 24 24" fill="none" stroke="' + teal + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" style="width:76px;height:76px;transform-origin:center;"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><svg id="upd-wave" viewBox="0 0 260 48" width="240" height="48" style="margin-top:18px;overflow:visible"><path id="g-ghost" fill="none" stroke="' + teal + '" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/><path id="g-bar" fill="none" stroke="' + teal + '" stroke-width="3.2" stroke-linecap="round"/></svg>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener("DOMContentLoaded", paint);
      window.__updPct = 0.08;
      function tick() {
        if (window.__updReveal) return;
        var path = document.getElementById("g-bar");
        var ghost = document.getElementById("g-ghost");
        if (!path) { requestAnimationFrame(tick); return; }
        var elapsed = Date.now() - t0;
        var phase = elapsed / 150;
        var target = window.__updDone ? 1 : Math.min(0.9, 0.1 + 0.8 * (1 - Math.exp(-(elapsed / 1000) / 0.85)));
        var cur = window.__updPct || 0;
        cur += (target - cur) * (window.__updDone ? 0.16 : 0.22);
        if (Math.abs(target - cur) < 0.004) cur = target;
        window.__updPct = cur;
        var dFull = waveD(260, 48, phase, 1);
        if (ghost) ghost.setAttribute("d", dFull);
        path.setAttribute("d", waveD(260, 48, phase, cur));
        if (window.__updDone && cur > 0.992 && !window.__updGrown) {
          window.__updGrown = true;
          var wave = document.getElementById("upd-wave");
          var house = document.getElementById("upd-house");
          if (wave) { wave.style.transition = "opacity .22s ease"; wave.style.opacity = "0"; }
          if (house) {
            house.style.transition = "transform .8s cubic-bezier(.22,.78,.28,1)";
            house.style.transform = "scale(18)";
          }
          setTimeout(function () {
            if (window.__updReveal) return;
            window.__updReveal = true;
            try { sessionStorage.removeItem("tj-updating"); } catch (e) {}
            document.documentElement.classList.remove("tj-updating");
            var c = document.getElementById("upd-cover");
            if (c) {
              c.style.transition = "opacity .34s ease";
              c.style.opacity = "0";
              setTimeout(function () { if (c.parentNode) c.remove(); }, 360);
            }
            if (typeof hideSplash === "function") hideSplash();
          }, 780);
          return;
        }
        requestAnimationFrame(tick);
      }
      window.__tickUpdateBar = tick;
      requestAnimationFrame(tick);
      setTimeout(function () {
        if (window.__updReveal) return;
        window.__updReveal = true;
        window.__updDone = true;
        try { sessionStorage.removeItem("tj-updating"); } catch (e) {}
        document.documentElement.classList.remove("tj-updating");
        var c = document.getElementById("upd-cover");
        if (c) c.remove();
      }, 12000);
    })();
  </script>
