  <style>
    html, body { margin: 0; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; background: #ffffff; z-index: 9999;
      display: grid; place-items: center;
    }
    #splash svg {
      width: 72px; height: 72px; opacity: 0;
      animation: splashHouse 1.8s ease forwards;
    }
    #splash.out { animation: splashFade .45s ease forwards; pointer-events: none; display: none; }
    #splash.out svg { animation: none; opacity: 0; }
    @keyframes splashHouse {
      0% { opacity: 0; transform: translateY(18px) scale(.86); }
      28% { opacity: 1; transform: translateY(0) scale(1); }
      62% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.05); }
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
  <script>
    (function () {
      var raw = "";
      try { raw = sessionStorage.getItem("tj-updating") || ""; } catch (e) {}
      var t0 = Number(raw) || 0;
      if (!t0) return;
      if (Date.now() - t0 > 20000) {
        try { sessionStorage.removeItem("tj-updating"); } catch (e) {}
        return;
      }
      document.documentElement.classList.add("tj-updating");
      function paint() {
        if (document.getElementById("upd-cover")) return;
        var el = document.createElement("div");
        el.id = "upd-cover";
        el.setAttribute("style", "position:fixed;inset:0;z-index:2147483646;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;");
        el.innerHTML = '<div style="font-size:13px;letter-spacing:.18em;color:#808680;">統潔＆信潔開發</div><div style="margin-top:10px;font-size:22px;font-weight:700;color:#1d2420;">正在更新</div><div style="margin-top:22px;width:min(280px,74vw);height:6px;border-radius:99px;background:#e6e8ea;overflow:hidden;"><div id="g-bar" style="height:100%;width:12%;border-radius:99px;background:linear-gradient(90deg,#4285F4,#EA4335 38%,#FBBC05 68%,#34A853);"></div></div>';
        (document.body || document.documentElement).appendChild(el);
      }
      if (document.body) paint();
      else document.addEventListener("DOMContentLoaded", paint);
      function tick() {
        if (window.__updDone) return;
        var bar = document.getElementById("g-bar");
        if (bar) {
          var elapsed = Date.now() - t0;
          var pct = Math.min(90, 12 + 78 * (1 - Math.exp(-(elapsed / 1000) / 0.8)));
          bar.style.width = pct.toFixed(1) + "%";
        }
        requestAnimationFrame(tick);
      }
      window.__tickUpdateBar = tick;
      requestAnimationFrame(tick);
      setTimeout(function () {
        if (window.__updReveal) return;
        window.__updReveal = true;
        window.__updDone = true;
        try { sessionStorage.removeItem("tj-updating"); } catch (e) {}
        document.documentElement.classList.remove("tj-updating");
        var c = document.getElementById("upd-cover");
        if (c) c.remove();
      }, 12000);
    })();
  </script>

<body>
  <div id="splash" aria-hidden="true">
    <svg class="splash-house" viewBox="0 0 24 24" fill="none" stroke="#62765b" stroke-width="1.8" stroke-linejoin="round">

    </svg>
